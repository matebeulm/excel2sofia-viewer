[package]
name = "excel2sofia-viewer"
version = "0.2.0"
edition = "2024"
description = "Viewer for excel2sofia output files"
repository = "https://github.com/matebeulm/excel2sofia-viewer"

[dependencies]
eframe = "0.31"
egui_plot = "0.31"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
